<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFT Sprite Generator MVP</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent: #007acc;
            --accent-hover: #005f9e;
            --active-tool: #4CAF50; /* Цвет выбранного инструмента */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .main-container {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .panel h2 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Рабочая зона (Сетка) */
        #drawCanvas {
            background-color: #000;
            cursor: crosshair;
            border: 2px solid #555;
            image-rendering: pixelated;
        }

        .tools {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Превью дисплей */
        .preview-screen-container {
            padding: 10px;
            background-color: #111;
            border: 4px solid #444;
            border-radius: 4px;
            display: inline-block;
        }

        #previewCanvas {
            background-color: #000;
            display: block;
        }

        .preview-note {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #999;
            font-family: monospace;
        }

        /* Кнопки */
        button, input[type="color"] {
            padding: 8px 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-upload {
            background-color: #7b1fa2;
        }
        .btn-upload:hover {
            background-color: #5e1580;
        }

        input[type="file"] {
            display: none;
        }

        /* Класс для активного инструмента (Кисть или Ластик) */
        .active-tool {
            background-color: var(--active-tool) !important;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        #btnClear {
            background-color: #d32f2f;
        }
        #btnClear:hover {
            background-color: #b71c1c;
        }

        /* Зона вывода кода */
        .output-section {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-row {
            display: flex;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 250px;
            background-color: #111;
            color: #4CAF50;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            resize: vertical;
        }

        .export-tools {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <h1>Генератор спрайтов для дисплея ST7789</h1>

    <div class="main-container">
        <!-- Левая колонка: Рисовалка -->
        <div class="panel">
            <h2>Canvas (128x128)</h2>
            <canvas id="drawCanvas" width="640" height="640"></canvas>
            <div class="tools">
                <input type="color" id="colorPicker" value="#00FF00" title="Выбрать цвет">
                <button id="btnPen" class="active-tool">Кисть</button>
                <button id="btnErase">Ластик</button>
                <label for="imageUpload" class="btn-upload" style="display:inline-block;">Загрузить изображение</label>
                <input type="file" id="imageUpload" accept="image/*">
                <label style="display:flex;align-items:center;gap:5px;font-size:13px;font-family:monospace;">
                    <input type="checkbox" id="bgRemoveToggle" checked style="width:16px;height:16px;padding:0;"> Удалить фон
                </label>
                <label style="display:flex;align-items:center;gap:5px;font-size:13px;font-family:monospace;">
                    Порог: <input type="number" id="bgTolerance" value="40" min="0" max="255" style="width:55px;padding:4px;background-color:#444;border:1px solid #666;color:#fff;border-radius:4px;">
                </label>
                <button id="btnClear">Очистить всё</button>
            </div>
        </div>

        <!-- Правая колонка: Превью -->
        <div class="panel">
            <h2>Превью дисплея (320x240)</h2>
            <div class="preview-screen-container">
                <canvas id="previewCanvas" width="320" height="240"></canvas>
            </div>
            <div class="preview-note">Спрайт зафиксирован по центру экрана</div>
        </div>
    </div>

    <!-- Нижняя часть: Вывод -->
    <div class="output-section">
        <div class="action-row">
            <button id="btnGenerate" style="font-size: 16px; padding: 10px 20px;">Ready / OK</button>
            <div class="export-tools">
                <button id="btnCopy">Copy Code</button>
                <button id="btnDownload">Download .h</button>
            </div>
        </div>
        <textarea id="outputCode" readonly placeholder="Нажми 'Ready / OK', чтобы сгенерировать C++ массив..."></textarea>
    </div>

    <script>
        // --- Настройки ---
        const GRID_SIZE = 128; 
        const DRAW_CANVAS_SIZE = 640; 
        const CELL_SIZE = DRAW_CANVAS_SIZE / GRID_SIZE; 

        const PREVIEW_W = 320;
        const PREVIEW_H = 240;
        // Фиксированная позиция спрайта на экране (центр)
        const FIXED_X = Math.floor((PREVIEW_W - GRID_SIZE) / 2);
        const FIXED_Y = Math.floor((PREVIEW_H - GRID_SIZE) / 2);
        
        let grid = new Array(GRID_SIZE * GRID_SIZE).fill('#000000');
        
        let isDrawing = false;
        let currentColor = '#00FF00'; 
        let isEraser = false;

        // --- DOM Элементы ---
        const drawCanvas = document.getElementById('drawCanvas');
        const ctxDraw = drawCanvas.getContext('2d');
        
        const previewCanvas = document.getElementById('previewCanvas');
        const ctxPreview = previewCanvas.getContext('2d');
        
        const colorPicker = document.getElementById('colorPicker');
        const outputCode = document.getElementById('outputCode');
        
        const btnPen = document.getElementById('btnPen');
        const btnErase = document.getElementById('btnErase');
        const imageUpload = document.getElementById('imageUpload');
        const bgRemoveToggle = document.getElementById('bgRemoveToggle');
        const bgTolerance = document.getElementById('bgTolerance');

        let lastLoadedImage = null; // запоминаем последнее загруженное изображение,
                                     // чтобы можно было пересчитать удаление фона без повторной загрузки

        // --- Инициализация ---
        function init() {
            drawGrid();
            updatePreview();
        }

        // --- Функция полной перерисовки холста (решает проблему с утолщением сетки) ---
        function drawGrid() {
            // Заливаем всё чёрным
            ctxDraw.fillStyle = '#000000';
            ctxDraw.fillRect(0, 0, DRAW_CANVAS_SIZE, DRAW_CANVAS_SIZE);
            
            // Рисуем закрашенные пиксели
            for (let i = 0; i < grid.length; i++) {
                if (grid[i] !== '#000000') {
                    let x = (i % GRID_SIZE) * CELL_SIZE;
                    let y = Math.floor(i / GRID_SIZE) * CELL_SIZE;
                    ctxDraw.fillStyle = grid[i];
                    ctxDraw.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                }
            }
            
            // Рисуем тонкую сетку поверх
            ctxDraw.strokeStyle = '#222222';
            ctxDraw.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctxDraw.beginPath();
                ctxDraw.moveTo(i * CELL_SIZE, 0);
                ctxDraw.lineTo(i * CELL_SIZE, DRAW_CANVAS_SIZE);
                ctxDraw.stroke();
                
                ctxDraw.beginPath();
                ctxDraw.moveTo(0, i * CELL_SIZE);
                ctxDraw.lineTo(DRAW_CANVAS_SIZE, i * CELL_SIZE);
                ctxDraw.stroke();
            }
        }

        function paintCell(event) {
            if (!isDrawing) return;
            
            const rect = drawCanvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            const col = Math.floor(x / CELL_SIZE);
            const row = Math.floor(y / CELL_SIZE);
            
            if (col >= 0 && col < GRID_SIZE && row >= 0 && row < GRID_SIZE) {
                const index = row * GRID_SIZE + col;
                const colorToPaint = isEraser ? '#000000' : currentColor;
                
                if (grid[index] !== colorToPaint) {
                    grid[index] = colorToPaint;
                    drawGrid(); // Полная перерисовка предотвращает наслаивание линий друг на друга
                    updatePreview();
                }
            }
        }

        // --- Слушатели мыши для Canvas ---
        drawCanvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            paintCell(e);
        });
        drawCanvas.addEventListener('mousemove', paintCell);
        drawCanvas.addEventListener('mouseup', () => { isDrawing = false; });
        drawCanvas.addEventListener('mouseleave', () => { isDrawing = false; });

        // --- Переключение активного инструмента ---
        function setActiveTool(tool) {
            btnPen.classList.remove('active-tool');
            btnErase.classList.remove('active-tool');
            if (tool === 'pen') btnPen.classList.add('active-tool');
            if (tool === 'erase') btnErase.classList.add('active-tool');
        }

        // --- Инструменты ---
        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
            isEraser = false;
            setActiveTool('pen');
        });

        btnPen.addEventListener('click', () => {
            isEraser = false;
            currentColor = colorPicker.value;
            setActiveTool('pen');
        });

        btnErase.addEventListener('click', () => {
            isEraser = true;
            setActiveTool('erase');
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            if(confirm('Точно очистить холст?')) {
                grid.fill('#000000');
                drawGrid();
                updatePreview();
            }
        });

        // --- Превью (фиксированная позиция по центру) ---
        function updatePreview() {
            ctxPreview.fillStyle = '#000000';
            ctxPreview.fillRect(0, 0, PREVIEW_W, PREVIEW_H);

            for (let i = 0; i < grid.length; i++) {
                if (grid[i] !== '#000000') {
                    let col = i % GRID_SIZE;
                    let row = Math.floor(i / GRID_SIZE);

                    let drawX = FIXED_X + col;
                    let drawY = FIXED_Y + row;

                    if (drawX >= 0 && drawX < PREVIEW_W && drawY >= 0 && drawY < PREVIEW_H) {
                        ctxPreview.fillStyle = grid[i];
                        ctxPreview.fillRect(drawX, drawY, 1, 1);
                    }
                }
            }
        }

        // --- Загрузка и пикселизация изображения ---
        function rgbToHex(r, g, b) {
            const toHex = (n) => n.toString(16).padStart(2, '0');
            return '#' + toHex(r) + toHex(g) + toHex(b);
        }

        // Удаление фона: flood fill от краёв изображения.
        // Цвет фона определяется как средний цвет 4 углов, затем от каждого
        // граничного пикселя запускается заливка — все связанные пиксели,
        // похожие по цвету (в пределах порога tolerance), становятся прозрачными.
        function removeBackground(canvas, tolerance) {
            const w = canvas.width;
            const h = canvas.height;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;

            const getRGB = (x, y) => {
                const i = (y * w + x) * 4;
                return [data[i], data[i + 1], data[i + 2]];
            };

            const corners = [getRGB(0, 0), getRGB(w - 1, 0), getRGB(0, h - 1), getRGB(w - 1, h - 1)];
            const bg = [0, 1, 2].map(c => Math.round(corners.reduce((s, p) => s + p[c], 0) / 4));

            const colorDist = (x, y) => {
                const [r, g, b] = getRGB(x, y);
                return Math.sqrt((r - bg[0]) ** 2 + (g - bg[1]) ** 2 + (b - bg[2]) ** 2);
            };

            const visited = new Uint8Array(w * h);
            const stack = [];
            for (let x = 0; x < w; x++) { stack.push([x, 0]); stack.push([x, h - 1]); }
            for (let y = 0; y < h; y++) { stack.push([0, y]); stack.push([w - 1, y]); }

            while (stack.length) {
                const [x, y] = stack.pop();
                if (x < 0 || x >= w || y < 0 || y >= h) continue;
                const idx = y * w + x;
                if (visited[idx]) continue;
                if (colorDist(x, y) > tolerance) continue;
                visited[idx] = 1;
                data[idx * 4 + 3] = 0; // делаем пиксель прозрачным
                stack.push([x + 1, y]);
                stack.push([x - 1, y]);
                stack.push([x, y + 1]);
                stack.push([x, y - 1]);
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function loadImageToGrid(img) {
            const removeBg = bgRemoveToggle.checked;
            const tolerance = parseInt(bgTolerance.value) || 0;

            // Работаем с изображением в исходном разрешении (до масштабирования) —
            // так заливка фона получается точнее, чем на уже уменьшенной картинке.
            const MAX_SRC = 768; // ограничиваем размер для производительности
            const srcScale = Math.min(1, MAX_SRC / Math.max(img.width, img.height));
            const srcW = Math.max(1, Math.round(img.width * srcScale));
            const srcH = Math.max(1, Math.round(img.height * srcScale));

            const srcCanvas = document.createElement('canvas');
            srcCanvas.width = srcW;
            srcCanvas.height = srcH;
            const srcCtx = srcCanvas.getContext('2d');
            srcCtx.imageSmoothingEnabled = true;
            srcCtx.drawImage(img, 0, 0, srcW, srcH);

            if (removeBg) {
                removeBackground(srcCanvas, tolerance);
            }

            // Определяем масштаб так, чтобы длинная сторона стала GRID_SIZE клеток
            const scale = GRID_SIZE / Math.max(srcW, srcH);
            const newW = Math.max(1, Math.round(srcW * scale));
            const newH = Math.max(1, Math.round(srcH * scale));

            // Рисуем уменьшенную версию изображения на временном канвасе
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = newW;
            tempCanvas.height = newH;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.imageSmoothingEnabled = true;
            tempCtx.drawImage(srcCanvas, 0, 0, newW, newH);

            const imageData = tempCtx.getImageData(0, 0, newW, newH).data;

            // Центрируем результат внутри сетки 64x64
            const offsetX = Math.floor((GRID_SIZE - newW) / 2);
            const offsetY = Math.floor((GRID_SIZE - newH) / 2);

            grid.fill('#000000');

            const ALPHA_THRESHOLD = 32; // пиксели с низкой непрозрачностью считаем "пустыми"

            for (let y = 0; y < newH; y++) {
                for (let x = 0; x < newW; x++) {
                    const srcIdx = (y * newW + x) * 4;
                    const r = imageData[srcIdx];
                    const g = imageData[srcIdx + 1];
                    const b = imageData[srcIdx + 2];
                    const a = imageData[srcIdx + 3];

                    const gridX = offsetX + x;
                    const gridY = offsetY + y;

                    if (gridX >= 0 && gridX < GRID_SIZE && gridY >= 0 && gridY < GRID_SIZE && a >= ALPHA_THRESHOLD) {
                        grid[gridY * GRID_SIZE + gridX] = rgbToHex(r, g, b);
                    }
                }
            }

            drawGrid();
            updatePreview();
        }

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    lastLoadedImage = img;
                    loadImageToGrid(img);
                };
                img.onerror = () => {
                    alert('Не удалось загрузить это изображение.');
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);

            // Сброс value, чтобы можно было повторно выбрать тот же файл
            e.target.value = '';
        });

        // Пересчитать пикселизацию при изменении настроек удаления фона
        // (без повторной загрузки файла)
        bgRemoveToggle.addEventListener('change', () => {
            if (lastLoadedImage) loadImageToGrid(lastLoadedImage);
        });
        bgTolerance.addEventListener('change', () => {
            if (lastLoadedImage) loadImageToGrid(lastLoadedImage);
        });

        // --- Конвертация в C++ ---
        function hexToRGB565(hexString) {
            let r = parseInt(hexString.substring(1, 3), 16);
            let g = parseInt(hexString.substring(3, 5), 16);
            let b = parseInt(hexString.substring(5, 7), 16);
            
            let rgb565 = ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
            
            let result = rgb565.toString(16).toUpperCase();
            return "0x" + result.padStart(4, '0');
        }

        function generateCode() {
            let code = `// Сгенерировано для ST7789\n`;
            code += `#include <pgmspace.h>\n\n`;
            code += `// Размер: ${GRID_SIZE}x${GRID_SIZE} пикселей\n`;
            code += `const uint16_t characterSprite[${GRID_SIZE * GRID_SIZE}] PROGMEM = {\n`;
            
            for (let i = 0; i < grid.length; i++) {
                if (i % 8 === 0) {
                    code += "  ";
                }
                
                code += hexToRGB565(grid[i]);
                
                if (i !== grid.length - 1) {
                    code += ", ";
                }
                
                if ((i + 1) % 8 === 0) {
                    code += "\n";
                }
            }
            
            code += `};\n`;
            outputCode.value = code;
        }

        document.getElementById('btnGenerate').addEventListener('click', generateCode);

        // --- Экспорт ---
        document.getElementById('btnCopy').addEventListener('click', () => {
            if (!outputCode.value) {
                alert("Сначала нажми 'Ready / OK'!");
                return;
            }
            navigator.clipboard.writeText(outputCode.value).then(() => {
                alert("Код скопирован в буфер обмена!");
            });
        });

        document.getElementById('btnDownload').addEventListener('click', () => {
            if (!outputCode.value) {
                alert("Сначала нажми 'Ready / OK'!");
                return;
            }
            const blob = new Blob([outputCode.value], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'character.h';
            
            document.body.appendChild(a);
            a.click();
            
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        });

        init();
    </script>
</body>
</html>
